name: export-edu-ml-weights
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export logistic weights (at_creation)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sync.ml_export_weights
