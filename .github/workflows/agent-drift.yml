name: agent-drift
on:
  schedule:
    # 09:30 UTC = 12:30 МСК: после сторожа красных линий (10:30) и репетиции
    # применения (11:00). Порядок не косметический — сторож в этот час
    # откатывает вредные изменения, и сверка, запущенная до него, назвала бы
    # дрейфом ещё не сделанный откат.
    #
    # Час назад было 08:30, и этого зазора перестало хватать. Диспетчер
    # GitHub задерживает запуск на 38–50 мин, и задержки Э1 и сверки выпадают
    # НЕЗАВИСИМО: Э1 мог стартовать в 08:50, а сверка в 09:08 — гарантированный
    # зазор был не 30 минут, а 18. Пока прогон применял максимум 50 действий
    # по одному запросу, он в 18 минут укладывался; после снятия лимита
    # действий (задача 7 плана беты) их стали сотни, и сверка читала бы
    # кабинет ПОСРЕДИ записи, объявляя дрейфом собственные изменения агента.
    # Батчи (задача 9а) сократили число запросов вшестеро, но гарантии не
    # дают: расчёт показал, что в худшем случае 300 действий в 18 минут не
    # укладываются ни при каком подтверждённом размере пачки. Лечится
    # разносом кронов, а не размером батча.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Глубина окна сверки в днях"
        required: false
        default: "21"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run drift check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          # DIRECT_CLIENTS_JSON не передаётся по той же причине, что у
          # сторожа: кабинет берётся из журнала. Изменение, применённое
          # кабинету, которого больше нет в списке клиентов, обязано
          # сверяться — иначе правка переменной снимала бы часть кабинета с
          # проверки молча.
        run: |
          # Всегда --prod: песочница этим логинам недоступна (Code 513, они
          # там не заведены), и прогон по ней вернул бы пустоту, выглядящую
          # как «расхождений нет». Записи у сверки нет вовсе, поэтому
          # боевой кабинет здесь безопасен — только чтение.
          #
          # --fail-on-alarm по крону: откат руками, исчезнувшая кампания и
          # разъехавшееся значение обязаны приходить письмом о красном ране,
          # а не лежать в логе зелёного.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m sync.agent_drift --prod --fail-on-alarm
          else
            python -m sync.agent_drift --prod --days=${{ github.event.inputs.days || '21' }}
          fi
