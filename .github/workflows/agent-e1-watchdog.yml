name: agent-e1-watchdog
on:
  schedule:
    # 07:30 UTC = 10:30 МСК: после расчёта agent-e0 (09:30 МСК) и сторожа
    # свежести данных (10:00 МСК). По крону — боевой откат с тревогами:
    # --prod --apply --fail-on-alarm (см. шаг Run ниже).
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      prod:
        description: "Боевой кабинет вместо песочницы"
        required: false
        type: boolean
        default: false
      apply:
        description: "РЕАЛЬНЫЙ ОТКАТ (без него — dry-run)"
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run E1a watchdog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # DIRECT_CLIENTS_JSON намеренно НЕ передаётся: кабинет откатываемого
          # действия берётся из журнала, а не из списка клиентов. Изменение,
          # применённое кабинету, которого в списке больше нет, обязано
          # откатываться — иначе правка переменной окружения тихо снимала бы
          # часть кабинета с наблюдения.
        run: |
          # Комбинация «песочница + запись» отклоняется и самим прогоном
          # (agent_e1_watchdog.refusal), но отсекается ещё здесь: в этом
          # режиме каждый откат падает «логин не подключен», а неудача
          # пишется в БОЕВОЙ журнал — база одна. Три таких прогона снимают
          # действие с наблюдения навсегда. Ошибка запуска обязана быть
          # видна как красный шаг, а не как «прогон отработал».
          if [ "${{ github.event.inputs.prod }}" != "true" ] \
             && [ "${{ github.event.inputs.apply }}" = "true" ]; then
            echo "Запрещено: apply без prod. Реальный откат — prod+apply; репетиция — без apply."
            exit 1
          fi
          # Та же мина, что у agent-e1: ручной запуск без галочки «боевой
          # кабинет» уходит в песочницу, где логины кабинета не заведены, и
          # каждый отвечает Code 513. Отказ словами вместо кода чужой ошибки.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ github.event.inputs.prod }}" != "true" ]; then
            echo "Песочница этим логинам недоступна (Code 513): они не заведены в sandbox Директа."
            echo "Репетиция по боевому кабинету — галочка prod без apply."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Крон существует ради боевого отката: репетиция по расписанию
            # ничего не защищает. --fail-on-alarm — чтобы тревоги (пробои,
            # неудачные откаты, зависшие строки) приходили письмом GitHub
            # о красном ране, а не лежали в логах зелёного.
            ARGS="--prod --apply --fail-on-alarm"
          else
            ARGS=""
            if [ "${{ github.event.inputs.prod }}" = "true" ]; then ARGS="$ARGS --prod"; fi
            if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          fi
          python -m sync.agent_e1_watchdog $ARGS
