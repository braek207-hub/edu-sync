name: agent-e1-watchdog
on:
  workflow_dispatch:
    inputs:
      prod:
        description: "Боевой кабинет вместо песочницы"
        required: false
        type: boolean
        default: false
      apply:
        description: "РЕАЛЬНЫЙ ОТКАТ (без него — dry-run)"
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run E1a watchdog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          # DIRECT_CLIENTS_JSON намеренно НЕ передаётся: кабинет откатываемого
          # действия берётся из журнала, а не из списка клиентов. Изменение,
          # применённое кабинету, которого в списке больше нет, обязано
          # откатываться — иначе правка переменной окружения тихо снимала бы
          # часть кабинета с наблюдения.
        run: |
          # Комбинация «песочница + запись» отклоняется и самим прогоном
          # (agent_e1_watchdog.refusal), но отсекается ещё здесь: в этом
          # режиме каждый откат падает «логин не подключен», а неудача
          # пишется в БОЕВОЙ журнал — база одна. Три таких прогона снимают
          # действие с наблюдения навсегда. Ошибка запуска обязана быть
          # видна как красный шаг, а не как «прогон отработал».
          if [ "${{ github.event.inputs.prod }}" != "true" ] \
             && [ "${{ github.event.inputs.apply }}" = "true" ]; then
            echo "Запрещено: apply без prod. Реальный откат — prod+apply; репетиция — без apply."
            exit 1
          fi
          ARGS=""
          if [ "${{ github.event.inputs.prod }}" = "true" ]; then ARGS="$ARGS --prod"; fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python -m sync.agent_e1_watchdog $ARGS
