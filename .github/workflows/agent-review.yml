name: agent-review
on:
  schedule:
    # Понедельник 09:00 UTC = 12:00 МСК: неделя закрыта, сверка и сторож за
    # выходные уже отработали. Разбор читает их следы, поэтому идёт после, а
    # не в одно время с ними.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Период разбора в днях"
        required: false
        default: "7"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run weekly review
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Ни DIRECT_TOKEN, ни клиентов: разбор не ходит в кабинет вовсе,
          # он читает уже собранный чёрный ящик.
        run: |
          # --fail-on-high по расписанию: находки веса high (молчащая
          # стадия, изменение, которого нет в кабинете) обязаны приходить
          # письмом о красном ране. Находки полегче ждут в отчёте.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m sync.agent_review --fail-on-high
          else
            python -m sync.agent_review --days=${{ github.event.inputs.days || '7' }}
          fi
