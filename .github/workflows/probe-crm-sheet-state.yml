name: probe-crm-sheet-state
# Заполненность листа CRM «Лиды» по месяцам — идёт ли обратное заполнение после
# опустошения 22.09.2026. Только счётчики.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Ключ сервис-аккаунта
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > sa.json
      - name: Состояние листа
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          CRM_LEADS_SHEETS: Лиды
        run: python probe_crm_sheet_state.py
