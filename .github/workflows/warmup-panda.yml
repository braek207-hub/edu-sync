name: Прогрев кэша Panda-BI

# Дублёр прогрева из EduDash: тот репозиторий приватный, и при исчерпанной квоте
# Actions (2000 мин/мес Free) событие деплоя пропадает впустую. Здесь — раз в день
# после ночных синков: они инвалидируют кэш свежими данными, и без прогрева первый
# утренний посетитель пересчитывает все месяцы с нуля. Холод после деплоя этот крон
# не закрывает — это делает warmup в EduDash по deployment_status, когда квота живая.
#
# Ответ без секрета не содержит цифр (см. app/api/warmup/route.ts в EduDash),
# печатать его в публичный лог безопасно.
on:
  schedule:
    - cron: "45 5 * * *" # 08:45 МСК — после основной волны ночных синков и сторожа
  workflow_dispatch:

concurrency:
  group: warmup-panda
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Дёрнуть /api/warmup
        run: |
          curl -fsS --max-time 300 --retry 3 --retry-delay 20 --retry-all-errors \
            "https://panda-bi.vercel.app/api/warmup" | tee /dev/stderr
