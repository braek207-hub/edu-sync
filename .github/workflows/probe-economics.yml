name: probe-economics
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary==2.9.9
      - name: Probe
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python probe_economics.py
