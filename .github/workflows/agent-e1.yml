name: agent-e1
on:
  schedule:
    # 08:00 UTC = 11:00 МСК: после расчёта Э0 (09:30 МСК) и сторожа отката
    # (10:30 МСК). По крону — только РЕПЕТИЦИЯ: боевая запись остаётся
    # ручным решением человека, а ежедневный dry-run показывает, что агент
    # СОБИРАЛСЯ сделать. Ровно так 25.08 поймали предложение заминусовать
    # ядро семантики: репетиция стоит ноль и ловит то, чего не видят тесты.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      prod:
        description: "Боевой кабинет вместо песочницы"
        required: false
        type: boolean
        default: false
      apply:
        description: "РЕАЛЬНАЯ ЗАПИСЬ (без неё — dry-run)"
        required: false
        type: boolean
        default: false
      max_campaigns:
        # Ограничитель существовал в коде (--max-campaigns), но не был проброшен
        # сюда — а прогон запускается только отсюда. То есть первую боевую
        # запись нечем было ограничить: настройки уровня кабинета
        # раскатываются на все кампании сразу.
        description: "Не больше N кампаний за прогон (первая боевая запись — 1)"
        required: false
        type: string
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run E1a
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
        run: |
          # Комбинация «песочница + запись» отклоняется и самим прогоном
          # (agent_e1.refusal), но отсекается ещё здесь — по тому же
          # образцу, что и у сторожа (agent-e1-watchdog.yml): в этом режиме
          # строка о попытке применения всё равно уходит в БОЕВОЙ журнал
          # (база одна), при транспортной ошибке получает «исход неизвестен»
          # и подставляет сторожа под откат объекта, которого в боевом
          # кабинете никогда не было. Ошибка запуска обязана быть видна как
          # красный шаг, а не как «прогон отработал».
          if [ "${{ github.event.inputs.prod }}" != "true" ] \
             && [ "${{ github.event.inputs.apply }}" = "true" ]; then
            echo "Запрещено: apply без prod. Боевая запись — prod+apply; репетиция — без apply."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Крон читает БОЕВОЙ кабинет, но не пишет: --prod без --apply.
            # Песочница здесь бесполезна — в ней нет ни кампаний, ни истории,
            # и репетиция показывала бы пустоту вместо реальных решений.
            ARGS="--prod"
          else
            ARGS=""
            if [ "${{ github.event.inputs.prod }}" = "true" ]; then ARGS="$ARGS --prod"; fi
            if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          fi
          LIMIT="${{ github.event.inputs.max_campaigns }}"
          if [ -n "$LIMIT" ]; then
            # Только целое: непустая нечисловая строка иначе молча уехала бы в
            # аргумент и уронила прогон разбором — но уже после старта.
            case "$LIMIT" in
              ''|*[!0-9]*) echo "max_campaigns должно быть целым числом, получено: $LIMIT"; exit 1;;
            esac
            ARGS="$ARGS --max-campaigns=$LIMIT"
          fi
          echo "Аргументы прогона:$ARGS"
          python -m sync.agent_e1 $ARGS
