name: agent-analyst
# Боевой путь — ЛОКАЛЬНЫЙ: планировщик Windows, задача EDU-agent-analyst,
# 12:15 МСК, python -m sync.agent_analyst --local (биллинг от подписки
# Claude Code, решение Павла 03.09). Этот workflow — резервный API-путь:
# без крона, руками, и живёт только если в секретах появится ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Период разбора в днях"
        required: false
        default: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run daily analyst
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ни DIRECT_TOKEN, ни клиентов: надзор read-only, в кабинет не ходит.
        run: python -m sync.agent_analyst --days=${{ github.event.inputs.days || '1' }}
