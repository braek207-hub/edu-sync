name: probe-direct-write
on:
  workflow_dispatch:
    inputs:
      real_write:
        description: "no-op запись в реальную кампанию (только если safe дал UNKNOWN)"
        required: false
        type: boolean
        default: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Probe
        env:
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
        run: |
          if [ "${{ github.event.inputs.real_write }}" = "true" ]; then
            python probe_direct_write_access.py --real
          else
            python probe_direct_write_access.py
          fi
      - name: Probe report fields
        env:
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
        run: python probe_report_fields.py
      - name: Probe metrika fields
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
        run: python probe_metrika_fields.py
      - name: Probe bidmodifiers (sandbox)
        env:
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
        run: python probe_bidmodifiers.py
