name: probe-budget-lever
# Разовый read-only замер под Э3.3: применим ли рычаг бюджета (см. probe_budget_lever.py).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Замер применимости рычага бюджета
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python probe_budget_lever.py
