name: E-com Demand Sync

on:
  schedule:
    - cron: "20 2 * * *"   # 05:20 Moscow, после основного синка
  workflow_dispatch:
    inputs:
      wordstat_from:
        description: "Бэкфилл недель с даты (YYYY-MM-DD); пусто = инкремент"
        required: false
        default: ""
      slugs:
        description: "Только эти проекты (через запятую, напр. meshnflesh); пусто = все"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run ecom demand sync
        run: python sync_ecom_demand.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YANDEX_SEARCHAPI_KEY: ${{ secrets.YANDEX_SEARCHAPI_KEY }}
          WORDSTAT_FROM: ${{ github.event.inputs.wordstat_from }}
          ECOM_DEMAND_SLUGS: ${{ github.event.inputs.slugs }}
      # Сброса кэша Panda-BI здесь нет намеренно: ecom_wordstat_demand читают роуты
      # /api/<slug>/demand-traffic с force-dynamic, тегом <slug>-data спрос не кэшируется.
      # Прежний сброс обнулял все дашборды и ничего не освежал.
