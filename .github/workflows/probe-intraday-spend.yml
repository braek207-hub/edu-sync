name: probe-intraday-spend
# Разовый read-only замер: видно ли расход текущего дня и с каким отставанием
# (см. probe_intraday_spend.py). От ответа зависит, возможен ли почасовой
# сторож аномалий вообще: витрины EDU наливаются раз в сутки.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Замер видимости расхода за сегодня
        env:
          # Ни DATABASE_URL, ни доступов на запись: проба ходит только в
          # Reports API и печатает в stdout.
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
        run: python probe_intraday_spend.py
