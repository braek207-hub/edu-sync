name: probe-beta-readiness
# Read-only проверка готовности агента к бете: схема, настройки, гейт
# данных, история тактов, журнал действий, заповедник, права записи.
# Ничего не меняет: единственный записывающий вызов идёт по заведомо
# несуществующему идентификатору и обязан отказать на уровне элемента.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Готовность к бете
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
        run: python probe_beta_readiness.py
