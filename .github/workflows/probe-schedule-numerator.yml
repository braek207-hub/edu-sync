name: probe-schedule-numerator
# Разовый: из чего сложены 24 числа расписания — фильтр рекламного трафика
# и дублирующиеся цели. Оба подозрения из аудита движка записи.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe числителя расписания
        env:
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
        run: python probe_schedule_numerator.py
