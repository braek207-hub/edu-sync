name: LIME GCC → Google Sheet (трафик + заказы)

on:
  schedule:
    # Два прогона в день (бэкап): если первый лёг/отменился/задержался планировщиком GitHub —
    # второй догонит (refresh идемпотентен, пишет последние 7 дней по дате-матчу).
    # 23:50 UTC = 02:50 МСК (осн.) и 06:00 UTC = 09:00 МСК (страховка).
    - cron: "50 23 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh | build | traffic-backfill | app-traffic-fill | probe | app-probe | shopify-probe"
        required: false
        default: "refresh"
      refresh_days:
        description: "Сколько дней назад обновлять (refresh). Default 7"
        required: false
        default: "7"
      gcc_from:
        description: "Бэкфилл build с даты YYYY-MM-DD (default 2025-08-01)"
        required: false
        default: ""
      gcc_to:
        description: "Бэкфилл build по дату YYYY-MM-DD (default вчера)"
        required: false
        default: ""

concurrency:
  group: lime-gcc-sheet
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # 60 мин: refresh дёргает медленные async-API (AppMetrica Logs API готовит файл
    # установок за 90д + сессии/покупки/диплинки, TW по дням, Shopify) — на 20 мин
    # плановый прогон 31.07 упирался в таймаут и убивался (cancelled), 30.07 не дописывался.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write Google service-account key
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}   # lime-reports SA — расшарен на GCC-книгу
        run: |
          if [ -z "$GSC_SA_KEY" ]; then echo "GSC_SA_KEY пуст" && exit 1; fi
          printf '%s' "$GSC_SA_KEY" > sa.json

      - name: GCC → Sheet
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPMETRICA_TOKEN: ${{ secrets.APPMETRICA_TOKEN }}   # аккаунтовый — видит и app 6299245
          API_LIME_SHOPIFY: ${{ secrets.API_LIME_SHOPIFY }}   # Admin API token GCC-магазина (страна доставки)
          GCC_METRICA_TOKEN: ${{ secrets.GCC_METRICA_TOKEN }}  # для metrika-probe (regionCountry)
          GCC_TRIPLEWHALE_API_KEY: ${{ secrets.GCC_TRIPLEWHALE_API_KEY }}  # для tw-shopify-check
          GCC_TW_SHOP_DOMAIN: ${{ secrets.GCC_TW_SHOP_DOMAIN }}
          LIME_GCC_MODE: ${{ github.event.inputs.mode || 'refresh' }}
          LIME_GCC_REFRESH_DAYS: ${{ github.event.inputs.refresh_days || '7' }}
          LIME_GCC_FROM: ${{ github.event.inputs.gcc_from }}
          LIME_GCC_TO: ${{ github.event.inputs.gcc_to }}
          APPMETRICA_POLL_MAX: "45"   # ~15 мин/экспорт: сессии тянутся мелкими чанками (7д) — готовятся быстро
          PYTHONIOENCODING: "utf-8"
        # Ретрай: до 3 попыток на транзиентный сбой API (Google/AppMetrica/TW/Shopify),
        # чтобы синк точно дошёл. Между попытками пауза. Падаем только если все 3 легли.
        run: |
          for attempt in 1 2 3; do
            echo "=== попытка $attempt/3 ==="
            if python -m sync.lime_gcc_report; then
              echo "=== успех с попытки $attempt ==="
              exit 0
            fi
            echo "=== попытка $attempt упала, пауза 60с ==="
            sleep 60
          done
          echo "=== все 3 попытки легли ==="
          exit 1

      - name: Самопроверка (последняя дата в книге)
        if: success()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          GCC_TRIPLEWHALE_API_KEY: ${{ secrets.GCC_TRIPLEWHALE_API_KEY }}
          GCC_TW_SHOP_DOMAIN: ${{ secrets.GCC_TW_SHOP_DOMAIN }}
          API_LIME_SHOPIFY: ${{ secrets.API_LIME_SHOPIFY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIME_GCC_MODE: verify
          PYTHONIOENCODING: "utf-8"
        run: python -m sync.lime_gcc_report
