name: agent-e0
on:
  schedule:
    # 06:30 UTC = 09:30 МСК: после всех синков (последний — 05:40 МСК) с
    # запасом на опоздание планировщика GitHub 1–3 ч. Красный гейт данных
    # внутри agent_e0 даёт exit 1 → письмо GitHub о красном ране.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Окно истории в днях"
        required: false
        default: "180"
      skip_direct:
        description: "Пропустить обращения к API Директа (только БД)"
        required: false
        type: boolean
        default: false
      rebuild_bulk:
        description: "Пересобрать объёмные витрины (объекты, поисковые запросы) с нуля"
        required: false
        type: boolean
        default: false
      rebuild_holdout:
        description: "Пересобрать заповедник (состав держится весь сезон — только осознанно)"
        required: false
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run E0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_TOKEN: ${{ secrets.DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.DIRECT_CLIENTS_JSON }}
          DIRECT_CLIENT_LOGIN: ${{ secrets.DIRECT_CLIENT_LOGIN }}
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '180' }}"
          if [ "${{ github.event.inputs.skip_direct }}" = "true" ]; then
            ARGS="$ARGS --skip-direct"
          fi
          if [ "${{ github.event.inputs.rebuild_holdout }}" = "true" ]; then
            ARGS="$ARGS --rebuild-holdout"
          fi
          if [ "${{ github.event.inputs.rebuild_bulk }}" = "true" ]; then
            ARGS="$ARGS --rebuild-bulk"
          fi
          python -m sync.agent_e0 $ARGS
