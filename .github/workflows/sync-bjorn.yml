name: Sync Bjorn Marketing → Supabase

# Переехал из приватного bjorn-dashboard 20.08.2026. Причина: минуты Actions
# бесплатны только публичным репозиториям, и в приватных задания перестали
# стартовать вовсе — синк bjorn встал 19.08, данные замерли на 18.08.
# Расписание и шаги сохранены один в один; секреты — свои в этом репозитории.
on:
  workflow_dispatch:
    inputs:
      rewrite_days:
        description: "Сколько последних завершённых дней переписать"
        required: false
        default: "7"

concurrency:
  group: bjorn-marketing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.BJORN_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.BJORN_SUPABASE_SERVICE_KEY }}
      METRICA_TOKEN: ${{ secrets.BJORN_METRICA_TOKEN }}
      METRICA_COUNTER_ID: ${{ secrets.BJORN_METRICA_COUNTER_ID }}
      METRICA_ATTRIBUTIONS: "automatic,first,lastsign"
      METRICA_GOAL_ADD_TO_CART: ${{ secrets.BJORN_METRICA_GOAL_ADD_TO_CART }}
      METRICA_GOAL_BEGIN_CHECKOUT: ${{ secrets.BJORN_METRICA_GOAL_BEGIN_CHECKOUT }}
      METRICA_GOAL_PURCHASE: ${{ secrets.BJORN_METRICA_GOAL_PURCHASE }}
      METRICA_ECOM_METRICS: ${{ secrets.BJORN_METRICA_ECOM_METRICS }}
      METRICA_ECOM_PURCHASE_DIMENSION: ${{ secrets.BJORN_METRICA_ECOM_PURCHASE_DIMENSION }}
      METRICA_ECOM_SKU_DIMENSION: ${{ secrets.BJORN_METRICA_ECOM_SKU_DIMENSION }}
      DIRECT_TOKEN: ${{ secrets.BJORN_DIRECT_TOKEN }}
      DIRECT_CLIENTS_JSON: ${{ secrets.BJORN_DIRECT_CLIENTS_JSON }}
      REWRITE_DAYS: ${{ github.event.inputs.rewrite_days || '7' }}
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Сначала то, из чего собирается главная витрина дашборда: staging Метрики и
      # Директа → build_fact → сверка. Товарные и объявленческие шаги идут ПОСЛЕ, потому
      # что витрина от них не зависит (build_fact/verify_fact читают только stg_*).
      # До 26.09.2026 порядок был обратный, и падение любого товарного шага (Logs API,
      # «запрос слишком сложный», таймаут DELETE) оставляло дашборд без данных за вчера.
      - name: Метрика — staging
        run: python -m sync.bjorn.sync_metrica

      - name: Директ — staging
        run: python -m sync.bjorn.sync_direct

      - name: Сборка витрины
        run: python -m sync.bjorn.build_fact

      - name: Сверка итогов
        run: python -m sync.bjorn.verify_fact

      - name: Метрика — строки ecommerce
        run: python -m sync.bjorn.sync_metrica_ecommerce

      - name: Метрика — атрибуция заказов (purchaseID)
        run: python -m sync.bjorn.sync_purchases

      # Покупки поштучно в трёх моделях — из них Panda-BI складывает ячейку «ПОКУПКИ» и
      # открывает её список. Кампания решается кодом build_fact, поэтому шаг после витрины.
      # Не прошёл — Panda докладывает покупки витрины на строку кампании, итоги целы.
      - name: Метрика — покупки поштучно по моделям
        run: python -m sync.bjorn.sync_purchase_fact

      # Товарная воронка — до просмотров карточек: sync_card_views берёт из неё справочник
      # товаров (load_products читает bjorn_product_daily).
      - name: Метрика — товарная воронка
        run: python -m sync.bjorn.sync_products

      - name: Директ — объявления и картинки
        run: python -m sync.bjorn.sync_ads

      # Последним: Logs API — самый долгий и самый очередной шаг (3,5–11 минут, 04.10.2026
      # не дождались вовсе), его падение не должно отменять объявления.
      - name: Метрика — просмотры карточек (Logs API)
        run: python -m sync.bjorn.sync_card_views

      # Каждый шаг пишет в базу только после того, как всё получил, поэтому записанное до
      # падения цело — и дашборд должен его увидеть. Прогон при этом остаётся красным.
      - name: Revalidate dashboard cache
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/revalidate_panda.py bjorn
