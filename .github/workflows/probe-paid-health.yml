name: probe-paid-health
# Разовый замер: есть ли оплаты в crm_lead_details за окно агента (см. probe_paid_health.py).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Замер здоровья оплат
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python probe_paid_health.py
