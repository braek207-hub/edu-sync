name: bjorn-build-retarget
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 — записывать в Директ, пусто — только показать план"
        required: false
        default: ""
      start_date:
        description: "Дата старта кампании (YYYY-MM-DD), пусто — сегодня"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Build BJORN retargeting mini-campaign
        env:
          METRICA_COUNTER_ID: ${{ secrets.BJORN_METRICA_COUNTER_ID }}
          DIRECT_TOKEN: ${{ secrets.BJORN_DIRECT_TOKEN }}
          DIRECT_CLIENTS_JSON: ${{ secrets.BJORN_DIRECT_CLIENTS_JSON }}
          APPLY: ${{ github.event.inputs.apply }}
          START_DATE: ${{ github.event.inputs.start_date }}
          PYTHONIOENCODING: "utf-8"
        run: python build_bjorn_retarget_campaign.py
