name: Sync LIME GCC → Supabase

on:
  schedule:
    # РАННИЙ прогон 00:00 UTC = 03:00 МСК: вчера уже завершилось (~3ч назад), GA4/TW обычно
    # готовы. Ранний старт = запас на зависание планировщика GitHub (кроны опаздывают на 1-3ч),
    # чтобы полные данные за вчера были к утру. Лист GCC подтянется сразу после (workflow_run).
    - cron: "0 0 * * *"
    # СТРАХОВКА 02:30 UTC = 05:30 МСК: DELETE+INSERT 7 дн. перезапишет вчера, если к 3 ночи
    # GA4 ещё не финализировал день (идемпотентно — второй прогон уточняет). Все страховки
    # укладываются ДО 08:00 МСК (лист подтянется ~05:45 через workflow_run).
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      sync_days:
        description: "Days back to sync (default 7). Игнорируется, если заданы sync_from И sync_to"
        required: false
        default: "7"
      sync_from:
        description: "Бэкфилл: дата начала YYYY-MM-DD (только вместе с sync_to)"
        required: false
      sync_to:
        description: "Бэкфилл: дата конца YYYY-MM-DD"
        required: false
      mode:
        description: "sync | regeo (ре-ингест только web-трафика на гео, заказы из lime_stats) | counters-only (только витрина счётчиков: бэкфилл живой Метрики, витрину не трогаем)"
        required: false
        default: "sync"
      dry_run:
        description: "1 = только печать, без записи (для regeo)"
        required: false
        default: ""

concurrency:
  group: lime-gcc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 180 мин — под бэкфилл (дневной прогон занимает ~1 мин и выходит сразу)
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GA4 service account key
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}   # lime-reports SA — scope analytics.readonly (GA4 трафик)
        run: |
          if [ -z "$GSC_SA_KEY" ]; then echo "GSC_SA_KEY пуст" && exit 1; fi
          printf '%s' "$GSC_SA_KEY" > sa.json

      - name: Run GCC sync
        # counters-only: длинный бэкфилл живой Метрики в витрину счётчиков не должен
        # перезаписывать lime_stats и полдня тянуть TW/GA4 за весь период.
        if: github.event.inputs.mode != 'counters-only'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          GCC_TRIPLEWHALE_API_KEY: ${{ secrets.GCC_TRIPLEWHALE_API_KEY }}
          GCC_TW_SHOP_DOMAIN: ${{ secrets.GCC_TW_SHOP_DOMAIN }}
          API_LIME_SHOPIFY: ${{ secrets.API_LIME_SHOPIFY }}   # offline Admin API token — страна доставки заказа
          APPMETRICA_TOKEN: ${{ secrets.APPMETRICA_TOKEN }}   # app-трафик (Reporting DAU + Logs-сплит best-effort)
          LIME_GCC_SYNC_DAYS: ${{ github.event.inputs.sync_days || '7' }}
          # Пусто на кроне → синк уходит в режим SYNC_DAYS (в коде `if frm and to`)
          LIME_GCC_SYNC_FROM: ${{ github.event.inputs.sync_from }}
          LIME_GCC_SYNC_TO: ${{ github.event.inputs.sync_to }}
          LIME_GCC_MODE: ${{ github.event.inputs.mode || 'sync' }}
          LIME_GCC_DRY_RUN: ${{ github.event.inputs.dry_run }}
          PYTHONIOENCODING: "utf-8"
        run: python -m sync.lime_gcc

      # Сверочная витрина счётчиков (Метрика 98232701 визиты/пользователи + GA4-заказы) —
      # после основного синка; падение сверки не валит главные данные (continue-on-error).
      - name: Run GCC counters compare
        # В обычном прогоне сверка второстепенна; в counters-only она и есть задача — падать честно.
        continue-on-error: ${{ github.event.inputs.mode != 'counters-only' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          GCC_METRICA_TOKEN: ${{ secrets.GCC_METRICA_TOKEN }}
          LIME_GCC_COUNTERS_DAYS: ${{ github.event.inputs.sync_days || '7' }}
          LIME_GCC_COUNTERS_FROM: ${{ github.event.inputs.sync_from }}
          LIME_GCC_COUNTERS_TO: ${{ github.event.inputs.sync_to }}
          PYTHONIOENCODING: "utf-8"
        run: python -m sync.lime_gcc_counters
