name: probe-crm-lag
# Разовый замер: насколько позже лида он появляется в базе. Величина нужна
# вместо догадки LEADS_LAG_DAYS и для гейта свежести CRM.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Замер лага CRM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python probe_crm_lag.py
