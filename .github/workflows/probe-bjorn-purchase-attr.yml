name: Probe BJORN purchase attribution

# Только чтение: покупки Метрики поштучно (purchaseID) в трёх моделях атрибуции против
# покупок витрины по ключу. Ничего не пишет; в лог — только агрегаты.

on:
  workflow_dispatch:
    inputs:
      probe_date1:
        description: "Начало окна (YYYY-MM-DD)"
        required: false
        default: ""
      probe_date2:
        description: "Конец окна (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run probe
        env:
          METRICA_TOKEN: ${{ secrets.BJORN_METRICA_TOKEN }}
          METRICA_COUNTER_ID: ${{ secrets.BJORN_METRICA_COUNTER_ID }}
          METRICA_GOAL_ADD_TO_CART: ${{ secrets.BJORN_METRICA_GOAL_ADD_TO_CART }}
          METRICA_GOAL_BEGIN_CHECKOUT: ${{ secrets.BJORN_METRICA_GOAL_BEGIN_CHECKOUT }}
          METRICA_GOAL_PURCHASE: ${{ secrets.BJORN_METRICA_GOAL_PURCHASE }}
          PROBE_DATE1: ${{ github.event.inputs.probe_date1 }}
          PROBE_DATE2: ${{ github.event.inputs.probe_date2 }}
          PYTHONIOENCODING: "utf-8"
        run: python probe_bjorn_purchase_attr.py
