name: LIME Roistat → Google Sheet (визиты + продажи)

on:
  schedule:
    - cron: "0 2 * * *"   # 05:00 Moscow (UTC+3)
  workflow_dispatch:
    inputs:
      mode:
        description: "build = построить вкладки и залить окно | probe = только прочитать | write = дате-матч в готовую книгу"
        required: false
        default: "build"
      days_back:
        description: "Сколько дней назад обновлять (write). Default 3"
        required: false
        default: "3"
      report_from:
        description: "Бэкфилл с даты YYYY-MM-DD (нужны обе)"
        required: false
        default: ""
      report_to:
        description: "Бэкфилл по дату YYYY-MM-DD"
        required: false
        default: ""

concurrency:
  group: lime-roistat-sheet
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write Google service-account key
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}   # lime-reports SA — расшарен на книгу отчёта
        run: |
          if [ -z "$GSC_SA_KEY" ]; then echo "GSC_SA_KEY пуст" && exit 1; fi
          printf '%s' "$GSC_SA_KEY" > sa.json

      - name: Roistat → Sheet
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
          ROISTAT_API_KEY: ${{ secrets.ROISTAT_API_KEY }}
          ROISTAT_PROJECT_ID: ${{ secrets.ROISTAT_PROJECT_ID }}
          LIME_REPORT_MODE: ${{ github.event.inputs.mode || 'build' }}
          LIME_REPORT_DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
          LIME_REPORT_FROM: ${{ github.event.inputs.report_from }}
          LIME_REPORT_TO: ${{ github.event.inputs.report_to }}
          PYTHONIOENCODING: "utf-8"
        run: python -m sync.lime_roistat_report
