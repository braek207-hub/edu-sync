# Одноразовый probe атрибуции приложения LIME (read-only, база не трогается):
# распределение паблишеров/трекеров в installations/deeplinks/clicks — данные
# для починки покрытия app-кампаний в витрине разделов (см. appmetrica_attr_probe).
name: probe-appmetrica-attr
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe AppMetrica attribution sources
        env:
          PYTHONUNBUFFERED: "1"
          APPMETRICA_TOKEN: ${{ secrets.APPMETRICA_TOKEN }}
        run: python -m sync.appmetrica_attr_probe
