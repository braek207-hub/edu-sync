name: Probe AppMetrica VK (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests
      - name: Probe AppMetrica VK fields
        env:
          APPMETRICA_TOKEN: ${{ secrets.APPMETRICA_TOKEN }}
          PYTHONIOENCODING: "utf-8"
        run: python scripts/probe_appmetrica_vk.py
