name: Sync Mesh-n-Flesh Direct Campaign Settings

on:
  schedule:
    # каждые 3 часа — тот же ритм, что чистильщик площадок РСЯ (placement-cleaner.yml)
    - cron: "35 */3 * * *"
  workflow_dispatch:

concurrency:
  group: meshnflesh-direct-settings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync meshnflesh campaign settings
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MESHNFLESH_DIRECT_TOKEN: ${{ secrets.MESHNFLESH_DIRECT_TOKEN }}
          MESHNFLESH_YANDEX_TOKEN: ${{ secrets.MESHNFLESH_YANDEX_TOKEN }}
        run: python -m sync.meshnflesh_direct_settings

      - name: Revalidate dashboard cache
        if: success()
        run: curl -sf -X POST https://panda-bi.vercel.app/api/revalidate || true
