name: probe-hourly
# Разовый: почему почасовой профиль опускает почти все часы.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe почасового профиля
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YM_TOKEN: ${{ secrets.YM_TOKEN }}
        run: python probe_hourly.py
