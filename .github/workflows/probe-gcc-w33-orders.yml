name: Probe GCC W33 orders variants (temp)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe linearAll variants vs manual
        env:
          GCC_TRIPLEWHALE_API_KEY: ${{ secrets.GCC_TRIPLEWHALE_API_KEY }}
          GCC_TW_SHOP_DOMAIN: ${{ secrets.GCC_TW_SHOP_DOMAIN }}
          API_LIME_SHOPIFY: ${{ secrets.API_LIME_SHOPIFY }}
          PYTHONIOENCODING: "utf-8"
        run: python scripts/probe_gcc_w33_orders_variants.py
